worker_processes 1;
events { worker_connections 1024; }

http {
  error_log /usr/local/openresty/nginx/logs/error.log info;

  # Shared cache for exchanged tokens (10 MB)
  lua_shared_dict sts_token_cache 10m;

  # TLS certificate trust store
  lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  lua_ssl_verify_depth 3;

  # DNS resolver – Docker embedded resolver
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name provider-gateway;

    location = /healthz { return 200 "OK\n"; }

    # All requests arriving at the Provider Gateway must carry a Factory-X token.
    # The gateway exchanges it against the Provider STS to obtain a Provider token,
    # then forwards the request to the Provider AAS (BaSyx or similar).
    location / {
      access_by_lua_block {
        require("sts").exchange({
          -- Provider STS token endpoint (inside the Docker network)
          sts_url        = "http://provider-sts:9050/sts/token",
          -- Audience expected by the Provider AAS
          target_service = "provider-aas",
        })
      }

      # Use a variable for proxy_pass so Nginx resolves the hostname at
      # request time (via the Docker embedded resolver), not at startup.
      # This prevents Nginx from failing to start when provider-aas is
      # not yet ready.
      set $upstream "http://provider-aas:8081";
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
