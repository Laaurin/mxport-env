worker_processes 1;
events { worker_connections 1024; }

http {
  error_log /usr/local/openresty/nginx/logs/error.log info;

  # Shared cache for exchanged tokens (10 MB)
  lua_shared_dict sts_token_cache 10m;

  # TLS certificate trust store
  lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  lua_ssl_verify_depth 3;

  # DNS resolver – must point to the Docker embedded resolver so that
  # container hostnames (e.g. provider-gateway) can be resolved at runtime.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Exact-match allowlist of Provider Gateways this Consumer Gateway
  # is allowed to forward requests to.
  # Add one Lua table entry per permitted provider, e.g.:
  #   ["provider-gateway"] = true,
  init_by_lua_block {
    allowed_providers = {
      ["provider-gateway"] = true,
    }
  }

  server {
    listen 80;
    server_name consumer-gateway;

    location = /healthz { return 200 "OK\n"; }

    # Requests must arrive as:
    #   GET /external/<provider_host>/<provider_path>
    #   Authorization: Bearer <consumer-token>
    #
    # The gateway will:
    #   1. Exchange the Bearer token against the Consumer STS to obtain
    #      a Factory-X token targeted at <provider_host>.
    #   2. Forward the request to https://<provider_host>/<provider_path>
    #      with the Factory-X token in the Authorization header.
    location ~ ^/external/(?<provider_host>[^/]+)(?<provider_path>/.*)$ {
      access_by_lua_block {
        local host = ngx.var.provider_host

        -- Reject anything not on the allowlist.
        if not allowed_providers[host] then
          ngx.log(ngx.WARN, "blocked non-allowlisted provider: ", host)
          return ngx.exit(ngx.HTTP_FORBIDDEN)
        end

        -- Exchange the incoming Consumer token for a Factory-X token
        -- targeted at the Provider Gateway.
        require("sts").exchange({
          -- Consumer STS token endpoint (inside the Docker network)
          sts_url        = "http://consumer-sts:9050/sts/token",
          target_service = host,
        })
      }

      proxy_set_header Host $provider_host;
      # In a local Docker-only setup the Provider Gateway is reachable via HTTP.
      # Change to https:// once you add TLS termination.
      proxy_pass http://$provider_host$provider_path;
    }
  }
}
