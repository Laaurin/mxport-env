apiVersion: apps/v1
kind: Deployment
metadata:
  name: company-lookup
  labels:
    app: company-lookup
spec:
  replicas: 1
  selector:
    matchLabels:
      app: company-lookup
  template:
    metadata:
      labels:
        app: company-lookup
    spec:
      containers:
        - name: company-lookup
          image: "{{ .Values.companyLookup.image.repository }}:{{ .Values.companyLookup.image.tag }}"
          imagePullPolicy: {{ .Values.companyLookup.image.pullPolicy }}
          command:
            - sh
            - -c
            - "alembic upgrade head && python -m scripts.import_descriptors /app/data/dataspace-actors.seed.json || true; exec company-lookup"
          ports:
            - containerPort: {{ .Values.companyLookup.port }}
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://{{ .Values.companyLookup.postgres.user }}:{{ .Values.companyLookup.postgres.password }}@company-lookup-db:{{ .Values.companyLookup.postgres.port }}/{{ .Values.companyLookup.postgres.db }}"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.companyLookup.port | quote }}
            - name: API_KEYS
              value: {{ .Values.companyLookup.adminKey | quote }}
            - name: CORS_ORIGINS
              value: "*"
          volumeMounts:
            - name: seed-data
              mountPath: /app/data/dataspace-actors.seed.json
              subPath: dataspace-actors.seed.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v2/openapi.json
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v2/openapi.json
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoExecute"
      volumes:
        - name: seed-data
          configMap:
            name: company-lookup-seed
---
apiVersion: v1
kind: Service
metadata:
  name: company-lookup
  labels:
    app: company-lookup
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.companyLookup.port }}
      targetPort: http
      name: http
  selector:
    app: company-lookup
{{- end }}

