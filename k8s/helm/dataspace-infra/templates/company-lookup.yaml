{{- if .Values.companyLookup.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: company-lookup-db
  labels:
    app: company-lookup-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: company-lookup-db
  template:
    metadata:
      labels:
        app: company-lookup-db
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.companyLookup.postgres.image.repository }}:{{ .Values.companyLookup.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.companyLookup.postgres.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.companyLookup.postgres.port }}
              name: postgres
          env:
            - name: POSTGRES_DB
              value: {{ .Values.companyLookup.postgres.db | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.companyLookup.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.companyLookup.postgres.password | quote }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U {{ .Values.companyLookup.postgres.user }} -d {{ .Values.companyLookup.postgres.db }}"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U {{ .Values.companyLookup.postgres.user }} -d {{ .Values.companyLookup.postgres.db }}"
            initialDelaySeconds: 10
            periodSeconds: 10
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoExecute"
---
apiVersion: v1
kind: Service
metadata:
  name: company-lookup-db
  labels:
    app: company-lookup-db
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.companyLookup.postgres.port }}
      targetPort: postgres
      name: postgres
  selector:
    app: company-lookup-db
---
