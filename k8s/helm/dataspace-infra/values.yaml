global:
  namespace: dataspace

mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "8"
    pullPolicy: IfNotPresent
  rootUsername: mongoAdmin
  rootPassword: mongoPassword
  port: 27017
  resources:
    limits:
      memory: 768Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 100m

keycloak:
  enabled: true
  image:
    repository: quay.io/keycloak/keycloak
    tag: "25.0"
    pullPolicy: IfNotPresent
  adminUser: admin
  adminPassword: admin
  port: 8080
  resources:
    limits:
      memory: 768Mi
      cpu: 1000m
    requests:
      memory: 384Mi
      cpu: 200m
  ingress:
    enabled: true
    host: keycloak.localhost
