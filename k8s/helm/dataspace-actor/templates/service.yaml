apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app: {{ .Release.Name }}-gateway
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      name: http
  selector:
    app: {{ .Release.Name }}-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-sts
  labels:
    app: {{ .Release.Name }}-sts
spec:
  type: ClusterIP
  ports:
    - port: 9050
      targetPort: http
      name: http
  selector:
    app: {{ .Release.Name }}-sts
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-aas
  labels:
    app: {{ .Release.Name }}-aas
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: http
      name: http
  selector:
    app: {{ .Release.Name }}-aas
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-secsm
  labels:
    app: {{ .Release.Name }}-secsm
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: http
      name: http
  selector:
    app: {{ .Release.Name }}-secsm
