apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-gateway-config
data:
  nginx.conf: |
    worker_processes 1;
    events { worker_connections 1024; }

    http {
      error_log /dev/stderr info;
      access_log /dev/stdout;
      lua_shared_dict sts_token_cache 10m;
      lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
      lua_ssl_verify_depth 3;

      resolver 10.43.0.10 valid=10s ipv6=off;

      init_by_lua_block {
        allowed_providers = {
          {{- range .Values.gateway.allowedProviders }}
          ["{{ . }}"] = true,
          {{- end }}
        }
      }

      server {
        listen 80;
        server_name {{ .Release.Name }}-gateway;

        location = /healthz { return 200 "OK\n"; }

        # Outbound proxy: Forward requests to another dataspace actor
        location ~ ^/external/(?<provider_host>[^/]+)(?<provider_path>/.*)$ {
          set $provider_target "";
          access_by_lua_block {
            local host = ngx.var.provider_host
            if not allowed_providers[host] then
              ngx.log(ngx.WARN, "blocked non-allowlisted provider: ", host)
              return ngx.exit(ngx.HTTP_FORBIDDEN)
            end

            local target = host
            if not string.find(host, "%.") then
              target = host .. ".{{ .Release.Namespace }}.svc.cluster.local"
            end
            ngx.var.provider_target = target

            {{- if .Values.sts.enabled }}
            require("sts").exchange({
              sts_url        = "http://{{ .Release.Name }}-sts.{{ .Release.Namespace }}.svc.cluster.local:9050/sts/token",
              target_service = host,
            })
            {{- end }}
          }

          proxy_set_header Host $provider_host;
          proxy_pass http://$provider_target$provider_path;
        }

        # Inbound proxy: Authenticate incoming customer requests & forward to local AAS
        location / {
          if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS, HEAD' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            return 204;
          }

          add_header 'Access-Control-Allow-Origin' $http_origin always;
          add_header 'Access-Control-Allow-Credentials' 'true' always;
          add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, X-Dataspace-Target-Host' always;
          add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS, HEAD' always;
          add_header 'Access-Control-Expose-Headers' 'X-Dataspace-Source-Token, X-Dataspace-Exchanged-Token' always;

          set $upstream "http://{{ .Release.Name }}-aas.{{ .Release.Namespace }}.svc.cluster.local:8081";
          set $upstream_host $host;

          access_by_lua_block {
            require("sts").route_request({
              local_actor    = "{{ .Values.actor.name }}",
              namespace      = "{{ .Release.Namespace }}",
              lookup_url     = "http://company-lookup.{{ .Release.Namespace }}.svc.cluster.local:50102/api/v2/companies",
              {{- if .Values.sts.enabled }}
              sts_url        = "http://{{ .Release.Name }}-sts.{{ .Release.Namespace }}.svc.cluster.local:9050/sts/token",
              target_service = "{{ .Release.Name }}-aas",
              {{- end }}
            })
          }

          header_filter_by_lua_block {
            if ngx.ctx.source_token then
              ngx.header["X-Dataspace-Source-Token"] = ngx.ctx.source_token
            end
            if ngx.ctx.exchanged_token then
              ngx.header["X-Dataspace-Exchanged-Token"] = ngx.ctx.exchanged_token
            end
          }

          proxy_pass $upstream;
          proxy_set_header Host $upstream_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_hide_header Access-Control-Allow-Origin;
          proxy_hide_header Access-Control-Allow-Credentials;
          proxy_hide_header Access-Control-Allow-Headers;
          proxy_hide_header Access-Control-Allow-Methods;
        }
      }
    }

  sts.lua: |
    local _M = {}
    local http  = require("resty.http")
    local cjson = require("cjson")

    local function decode_b64_id(raw)
      if not raw or raw == "" then return nil end
      local unescaped = ngx.unescape_uri(raw)
      local std = string.gsub(string.gsub(unescaped, "%-", "+"), "_", "/")
      local rem = #std % 4
      if rem == 2 then
        std = std .. "=="
      elseif rem == 3 then
        std = std .. "="
      end
      return ngx.decode_base64(std), unescaped
    end

    local function to_b64url(raw)
      local unescaped = ngx.unescape_uri(raw)
      local b64url = string.gsub(string.gsub(unescaped, "%+", "-"), "/", "_")
      return string.gsub(b64url, "=+$", "")
    end

    local VIEWER_CREDENTIALS = {
      ["d"] = { realm = "actor-d", client_id = "actor-d-client", client_secret = "actor-d-secret-12345" },
      ["e"] = { realm = "actor-e", client_id = "actor-e-client", client_secret = "actor-e-secret-12345" },
      ["f"] = { realm = "actor-f", client_id = "actor-f-client", client_secret = "actor-f-secret-12345" },
    }

    local function ensure_viewer_auth(opts)
      local origin = ngx.req.get_headers()["Origin"] or ngx.req.get_headers()["Referer"] or ""
      local viewer_actor = string.match(origin, "^https?://viewer%-actor%-([def])%.localhost")
        or string.match(origin, "^https?://viewer%-([def])%.localhost")

      if not viewer_actor then
        local auth = ngx.req.get_headers()["Authorization"]
        if auth and string.match(auth, "^[Bb]earer%s+.+$") then
          return auth
        end
        return nil
      end

      local creds = VIEWER_CREDENTIALS[viewer_actor]
      if not creds then
        return nil
      end

      local cache = ngx.shared[opts.cache_name or "sts_token_cache"]
      local cache_key = "kc_viewer_tok_v2:" .. viewer_actor
      local kc_token = cache and cache:get(cache_key)

      if not kc_token then
        local ns = opts.namespace or "dataspace"
        local kc_url = "http://keycloak." .. ns .. ".svc.cluster.local:8080/realms/" .. creds.realm .. "/protocol/openid-connect/token"
        local httpc = http.new()
        local res, err = httpc:request_uri(kc_url, {
          method  = "POST",
          headers = {
            ["Content-Type"] = "application/x-www-form-urlencoded",
            ["Host"]         = "keycloak.localhost",
          },
          body    = "grant_type=client_credentials"
            .. "&client_id=" .. ngx.escape_uri(creds.client_id)
            .. "&client_secret=" .. ngx.escape_uri(creds.client_secret),
        })
        if res and res.status == 200 and res.body then
          local ok, data = pcall(cjson.decode, res.body)
          if ok and data and data.access_token then
            kc_token = data.access_token
            local ttl = math.max(30, (tonumber(data.expires_in) or 300) - 30)
            if cache then cache:set(cache_key, kc_token, ttl) end
          end
        else
          ngx.log(ngx.WARN, "sts.ensure_viewer_auth: failed to obtain viewer token for actor-", viewer_actor, ": ", err or (res and res.status))
        end
      end

      if kc_token then
        local bearer = "Bearer " .. kc_token
        ngx.req.set_header("Authorization", bearer)
        return bearer
      end
      return nil
    end

    function _M.route_request(opts)
      opts = opts or {}
      ensure_viewer_auth(opts)
      local uri = ngx.var.uri or ""
      local b64_seg = string.match(uri, "^/shells/([^/]+)") or string.match(uri, "^/submodels/([^/]+)")

      if b64_seg then
        local decoded_urn = decode_b64_id(b64_seg)
        local actor_short = string.gsub(opts.local_actor or "", "^actor%-", "")
        local local_prefix = "urn:dataspace:" .. actor_short .. ":"

        if decoded_urn and string.sub(decoded_urn, 1, 14) == "urn:dataspace:" and string.sub(decoded_urn, 1, #local_prefix) ~= local_prefix then
          local b64url = to_b64url(b64_seg)
          local cache = ngx.shared[opts.cache_name or "sts_token_cache"]
          local cache_key = "lookup_gw:" .. b64url
          local resolved_actor = cache and cache:get(cache_key)

          if not resolved_actor and opts.lookup_url then
            local httpc = http.new()
            local lookup_req_url = opts.lookup_url .. "?asset_id=" .. ngx.escape_uri(b64url)
            ngx.log(ngx.INFO, "sts.route_request: resolving foreign URN ", decoded_urn, " via Company Lookup: ", lookup_req_url)
            local res, err = httpc:request_uri(lookup_req_url, { method = "GET" })
            if res and res.status == 200 and res.body then
              local ok, data = pcall(cjson.decode, res.body)
              if ok and data and type(data.result) == "table" and data.result[1] and type(data.result[1].endpoints) == "table" then
                for _, ep in ipairs(data.result[1].endpoints) do
                  local href = ep and ep.protocolInformation and ep.protocolInformation.href
                  if type(href) == "string" then
                    local m = string.match(href, "^https?://actor%-([a-z0-9%-]+)%.localhost")
                    if m then
                      resolved_actor = m
                      if cache then cache:set(cache_key, resolved_actor, 60) end
                      break
                    end
                  end
                end
              end
            else
              ngx.log(ngx.WARN, "sts.route_request: Company Lookup failed for ", decoded_urn, ": ", err or (res and res.status))
            end
          end

          if resolved_actor then
            local ns = opts.namespace or "dataspace"
            ngx.var.upstream = "http://actor-" .. resolved_actor .. "-gateway." .. ns .. ".svc.cluster.local:80"
            ngx.var.upstream_host = "actor-" .. resolved_actor .. ".localhost"
            ngx.log(ngx.INFO, "sts.route_request: proxying foreign URN ", decoded_urn, " to ", ngx.var.upstream)
            return
          end
        end
      end

      if opts.sts_url then
        _M.exchange(opts)
      end
    end

    function _M.exchange(opts)
      opts = opts or {}
      local sts_url = opts.sts_url
      if not sts_url then
        ngx.log(ngx.ERR, "sts.exchange: sts_url is required")
        ngx.exit(500)
      end

      local target_service = opts.target_service
      if not target_service then
        ngx.log(ngx.ERR, "sts.exchange: target_service is required")
        ngx.exit(500)
      end

      local cache_name  = opts.cache_name  or "sts_token_cache"
      local default_ttl = opts.default_ttl or 300

      local auth = ngx.req.get_headers()["Authorization"]
      if not auth then
        return
      end

      local source_token = string.match(auth, "^[Bb]earer%s+(.+)$")
      if not source_token then return end

      local cache = ngx.shared[cache_name]
      local cache_key = target_service .. ":" .. source_token
      local target_token = cache:get(cache_key)

      if not target_token then
        local httpc = http.new()
        ngx.log(ngx.INFO, "sts.exchange: requesting token from ", sts_url, " for target ", target_service)
        local res, err = httpc:request_uri(sts_url, {
          method  = "POST",
          headers = { ["Content-Type"] = "application/x-www-form-urlencoded" },
          body    = "grant_type="
            .. ngx.escape_uri("urn:ietf:params:oauth:grant-type:token-exchange")
            .. "&subject_token_type="
            .. ngx.escape_uri("urn:ietf:params:oauth:token-type:jwt")
            .. "&subject_token=" .. ngx.escape_uri(source_token),
        })

        if not res then
          ngx.log(ngx.ERR, "sts.exchange: failed to request token from ", sts_url, ": ", err)
          ngx.status = 502
          ngx.exit(502)
        elseif res.status ~= 200 then
          ngx.log(ngx.ERR, "sts.exchange: STS returned status ", res.status, ", body: ", res.body)
          local status = (res.status >= 400 and res.status < 500) and 401 or 502
          ngx.status = status
          ngx.exit(status)
        end

        local data = cjson.decode(res.body)
        target_token = data.access_token
        cache:set(cache_key, target_token, tonumber(data.expires_in) or default_ttl)
      end

      ngx.ctx.source_token = source_token
      ngx.ctx.exchanged_token = target_token
      ngx.req.set_header("Authorization", "Bearer " .. target_token)
    end

    return _M
{{- if .Values.sts.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-sts-config
data:
  server-config.yml: |
    serviceConfiguration:
      issuer: http://{{ .Release.Name }}-sts:9050/sts
      chooseFilterManagerBySubjectToken: true
      signingKeyAlias: {{ .Release.Name }}-sts-key
      tokenExchangeFilterConfigurationYml: filter-config/filter-config.yml
      plainkey:
        keyLocation: signingkey/private_key.pem
        keyId: {{ .Release.Name }}-sts-key
      outgoingTokenScopeClaimName: scope
      forceOverwriteIssuerWithConfiguredValue: true
      forceOverwriteIatWithNow: true
      forceNewJti: true

    issuerSpecificConfiguration:
      # Local Keycloak (for outbound token issuance)
      - issuer: http://keycloak:8080/realms/{{ .Values.actor.name }}
        jwksUri: "http://keycloak:8080/realms/{{ .Values.actor.name }}/protocol/openid-connect/certs"
        connectionTimeoutInMs: 20000
        readTimeoutInMs: 20000
        tokenScopeClaimName: scope
        propagateIssuerToValidators: true
        disableSubjectTokenClaimsSetValidator: false
        subjectTokenClaimsSetValidator:
          issuerRequired: true
          expiryClaimRequired: true
          expiryCheckDisabled: false
        actorTokenRequired: false

      - issuer: http://keycloak.localhost/realms/{{ .Values.actor.name }}
        jwksUri: "http://keycloak:8080/realms/{{ .Values.actor.name }}/protocol/openid-connect/certs"
        connectionTimeoutInMs: 20000
        readTimeoutInMs: 20000
        tokenScopeClaimName: scope
        propagateIssuerToValidators: true
        disableSubjectTokenClaimsSetValidator: false
        subjectTokenClaimsSetValidator:
          issuerRequired: true
          expiryClaimRequired: true
          expiryCheckDisabled: false
        actorTokenRequired: false

      {{- range .Values.sts.trustedIssuers }}
      # Trusted incoming partner: {{ .name }}
      - issuer: {{ .issuer }}
        jwksUri: {{ .jwksUri | quote }}
        connectionTimeoutInMs: 20000
        readTimeoutInMs: 20000
        tokenScopeClaimName: scope
        propagateIssuerToValidators: true
        disableSubjectTokenClaimsSetValidator: false
        subjectTokenClaimsSetValidator:
          issuerRequired: true
          expiryClaimRequired: true
          expiryCheckDisabled: false
        actorTokenRequired: false
      {{- end }}

  filter-config.yml: |
    # Outbound tokens from local Keycloak
    !!com.siemens.iam.exchange.core.filter.ClaimsCopyFilter
      issuer: http://keycloak:8080/realms/{{ .Values.actor.name }}
      claimsMap:
        sub: sub
        scope: scope
        roles: roles
        realm_access: realm_access
    ---
    !!com.siemens.iam.exchange.core.filter.SetExpiryFilter
      issuer: http://keycloak:8080/realms/{{ .Values.actor.name }}
      referenceSubjectIat: false
      expiry: 300
    ---
    !!com.siemens.iam.exchange.core.filter.ClaimsAppenderFilter
      issuer: http://keycloak:8080/realms/{{ .Values.actor.name }}
      claimsMap:
        environment: {{ .Values.actor.name }}
        aud: {{ .Release.Name }}-aas
    ---
    !!com.siemens.iam.exchange.core.filter.ClaimsCopyFilter
      issuer: http://keycloak.localhost/realms/{{ .Values.actor.name }}
      claimsMap:
        sub: sub
        scope: scope
        roles: roles
        realm_access: realm_access
    ---
    !!com.siemens.iam.exchange.core.filter.SetExpiryFilter
      issuer: http://keycloak.localhost/realms/{{ .Values.actor.name }}
      referenceSubjectIat: false
      expiry: 300
    ---
    !!com.siemens.iam.exchange.core.filter.ClaimsAppenderFilter
      issuer: http://keycloak.localhost/realms/{{ .Values.actor.name }}
      claimsMap:
        environment: {{ .Values.actor.name }}
        aud: {{ .Release.Name }}-aas
    {{- range .Values.sts.trustedIssuers }}
    ---
    # Inbound tokens from partner {{ .name }}
    !!com.siemens.iam.exchange.core.filter.ClaimsCopyFilter
      issuer: {{ .issuer }}
      claimsMap:
        sub: sub
        scope: scope
        roles: roles
        realm_access: realm_access
    ---
    !!com.siemens.iam.exchange.core.filter.SetExpiryFilter
      issuer: {{ .issuer }}
      referenceSubjectIat: false
      expiry: 300
    ---
    !!com.siemens.iam.exchange.core.filter.ClaimsAppenderFilter
      issuer: {{ .issuer }}
      claimsMap:
        environment: {{ $.Values.actor.name }}
        aud: {{ $.Release.Name }}-aas
    {{- end }}
{{- end }}
{{- if .Values.secsm.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-secsm-config
data:
  application.properties: |
    server.port=8081
    basyx.backend=MongoDB
    spring.data.mongodb.uri=mongodb://mongoAdmin:mongoPassword@mongodb:27017/{{ .Release.Name }}_secsm?authSource=admin
    spring.mongodb.uri=mongodb://mongoAdmin:mongoPassword@mongodb:27017/{{ .Release.Name }}_secsm?authSource=admin
    basyx.feature.authorization.enabled=true
    basyx.feature.authorization.type=rbac
    basyx.feature.authorization.jwtBearerTokenProvider=keycloak
    basyx.feature.authorization.rbac.file=file:/application/rbac_rules.json
    spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/BaSyx

  rbac_rules.json: |
    [
      {
        "role": "admin",
        "action": ["CREATE", "READ", "UPDATE", "DELETE"],
        "targetInformation": {
          "@type": "submodel",
          "submodelIds": "*",
          "submodelElementIdShortPaths": "*"
        }
      }
    ]

  initial-submodel.json: |
    {
      "modelType": "Submodel",
      "id": "SecuritySubmodel",
      "idShort": "TechnicalData",
      "kind": "Instance",
      "submodelElements": [],
      "semanticId": {
        "keys": [
          {
            "type": "GlobalReference",
            "value": "0173-1#01-AFZ615#016"
          }
        ],
        "type": "ExternalReference"
      }
    }
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-aas-config
data:
  application.properties: |
    server.port=8081
    basyx.backend=InMemory
    basyx.environment=file:aas
    basyx.cors.allowed-origins=*
    basyx.cors.allowed-methods=GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD

    {{- if .Values.rbac.enabled }}
    basyx.feature.authorization.enabled=true
    basyx.feature.authorization.type=rbac
    basyx.feature.authorization.jwtBearerTokenProvider=keycloak
    basyx.feature.authorization.rbac.file=file:/application/rbac_rules.json

    {{- if .Values.secsm.enabled }}
    basyx.feature.authorization.rules.backend=Submodel
    basyx.feature.authorization.rules.backend.submodel.authorization.endpoint=http://{{ .Release.Name }}-secsm:8081/submodels/U2VjdXJpdHlTdWJtb2RlbA==
    basyx.feature.authorization.rules.backend.submodel.authorization.token-endpoint=http://keycloak:8080/realms/BaSyx/protocol/openid-connect/token
    basyx.feature.authorization.rules.backend.submodel.authorization.grant-type=CLIENT_CREDENTIALS
    basyx.feature.authorization.rules.backend.submodel.authorization.client-id=workstation-1
    basyx.feature.authorization.rules.backend.submodel.authorization.client-secret=nY0mjyECF60DGzNmQUjL81XurSl8etom
    {{- end }}

    spring.security.oauth2.resourceserver.jwt.issuer-uri=http://{{ .Release.Name }}-sts:9050/sts
    basyx.aasenvironment.authorization.preconfiguration.token-endpoint=http://keycloak:8080/realms/BaSyx/protocol/openid-connect/token
    basyx.aasenvironment.authorization.preconfiguration.grant-type=CLIENT_CREDENTIALS
    basyx.aasenvironment.authorization.preconfiguration.client-id=workstation-1
    basyx.aasenvironment.authorization.preconfiguration.client-secret=nY0mjyECF60DGzNmQUjL81XurSl8etom
    {{- else }}
    basyx.feature.authorization.enabled=false
    {{- end }}
    spring.servlet.multipart.max-request-size=128MB
    spring.servlet.multipart.max-file-size=128MB

  {{- if .Values.rbac.enabled }}
  rbac_rules.json: |
    {{- if .Values.rbac.rules }}
    {{ toJson .Values.rbac.rules | indent 4 }}
    {{- else }}
    [
      {
        "role": "admin",
        "action": ["CREATE", "READ", "UPDATE", "DELETE", "EXECUTE"],
        "targetInformation": {
          "@type": "concept-description",
          "conceptDescriptionIds": "*"
        }
      },
      {
        "role": "admin",
        "action": ["CREATE", "READ", "UPDATE", "DELETE", "EXECUTE"],
        "targetInformation": {
          "@type": "aas",
          "aasIds": "*"
        }
      },
      {
        "role": "admin",
        "action": ["CREATE", "READ", "UPDATE", "DELETE", "EXECUTE"],
        "targetInformation": {
          "@type": "submodel",
          "submodelIds": "*",
          "submodelElementIdShortPaths": "*"
        }
      },
      {
        "role": "admin",
        "action": ["CREATE", "READ", "UPDATE", "DELETE", "EXECUTE"],
        "targetInformation": {
          "@type": "aas-environment",
          "aasIds": "*",
          "submodelIds": "*",
          "conceptDescriptionIds": "*"
        }
      }
    ]
    {{- end }}
  {{- end }}

  model.json: |-
{{- if .Values.aasModel }}
{{ toJson .Values.aasModel | indent 4 }}
{{- else }}
{{ .Files.Get (printf "files/models/%s.json" .Values.actor.name) | indent 4 }}
{{- end }}
