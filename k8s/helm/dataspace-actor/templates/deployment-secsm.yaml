{{- if .Values.secsm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-secsm
  labels:
    app: {{ .Release.Name }}-secsm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-secsm
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-secsm
    spec:
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoExecute"
      containers:
        - name: secsm
          image: "eclipsebasyx/submodel-repository:2.0.0-SNAPSHOT"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx160m -XX:+UseSerialGC"
          volumeMounts:
            - name: secsm-config
              mountPath: /application/application.properties
              subPath: application.properties
            - name: secsm-config
              mountPath: /application/rbac_rules.json
              subPath: rbac_rules.json
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
      volumes:
        - name: secsm-config
          configMap:
            name: {{ .Release.Name }}-secsm-config
{{- end }}
