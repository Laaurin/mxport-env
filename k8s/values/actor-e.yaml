rbac:
  enabled: true
  rules:
    - role: "admin"
      action: ["CREATE", "READ", "UPDATE", "DELETE", "EXECUTE"]
      targetInformation:
        "@type": "concept-description"
        conceptDescriptionIds: "*"
    - role: "admin"
      action: ["CREATE", "READ", "UPDATE", "DELETE", "EXECUTE"]
      targetInformation:
        "@type": "aas"
        aasIds: "*"
    - role: "admin"
      action: ["CREATE", "READ", "UPDATE", "DELETE", "EXECUTE"]
      targetInformation:
        "@type": "submodel"
        submodelIds: "*"
        submodelElementIdShortPaths: "*"
    - role: "admin"
      action: ["CREATE", "READ", "UPDATE", "DELETE", "EXECUTE"]
      targetInformation:
        "@type": "aas-environment"
        aasIds: "*"
        submodelIds: "*"
        conceptDescriptionIds: "*"
    # Owner role (Actor E itself)
    - role: "partner-e"
      action: ["CREATE", "READ", "UPDATE", "DELETE", "EXECUTE"]
      targetInformation:
        "@type": "aas"
        aasIds: "*"
    - role: "partner-e"
      action: ["CREATE", "READ", "UPDATE", "DELETE", "EXECUTE"]
      targetInformation:
        "@type": "submodel"
        submodelIds: "*"
        submodelElementIdShortPaths: "*"
    # Customer F: Full access to TimeSeries Submodel + Nameplate
    - role: "customer-e"
      action: ["READ"]
      targetInformation:
        "@type": "aas"
        aasIds:
          - "urn:dataspace:e:aas:produced-part-001"
    - role: "customer-e"
      action: ["READ"]
      targetInformation:
        "@type": "submodel"
        submodelIds:
          - "urn:dataspace:e:sm:nameplate"
          - "urn:dataspace:e:sm:timeseries"
        submodelElementIdShortPaths: "*"
    # Other partners (e.g. Actor D): Access to Nameplate ONLY ("andere sehen nur Nameplate")
    - role: "partner-d"
      action: ["READ"]
      targetInformation:
        "@type": "aas"
        aasIds:
          - "urn:dataspace:e:aas:produced-part-001"
    - role: "partner-d"
      action: ["READ"]
      targetInformation:
        "@type": "submodel"
        submodelIds:
          - "urn:dataspace:e:sm:nameplate"
        submodelElementIdShortPaths: "*"
